name: macOS build (fork CI)

# Builds Mac.apk on a GitHub-hosted Apple Silicon runner (macOS 26), to check
# framework changes before they are offered upstream. Run it by hand:
#   gh workflow run macos-build.yml -R 5566brs/win.apk -f repo=kksimp/Mac.apk -f ref=main
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository to build
        required: true
        default: kksimp/Mac.apk
      ref:
        description: Branch, tag or SHA
        required: true
        default: main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}

      - name: Platform
        run: |
          sw_vers
          uname -m
          xcode-select -p

      - name: Toolchain
        run: |
          brew install cmake openjdk@21 capstone apktool
          echo "JAVA_HOME=$(brew --prefix)/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home" >> "$GITHUB_ENV"

      - name: Check requirements
        run: scripts/check-requirements.sh

      - name: Java framework only
        run: debug/build_java_only.sh

      - name: Full runtime build
        run: runtime/scripts/build.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
