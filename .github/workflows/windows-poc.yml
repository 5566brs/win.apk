# Win.apk phase-1 PoC: build the Android x86_64 test libraries on Linux, then
# build the loader on a real Windows x64 runner and run the checks there.
name: Windows PoC

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-poc.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest:
    name: Android x86_64 test libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install clang + lld
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - name: Build guest .so files
        run: windows/test/build_guest.sh "$RUNNER_TEMP/guest"
      - name: Build end-to-end guest library and Java class
        run: windows/test/build_e2e.sh "$JAVA_HOME/include" "$JAVA_HOME/bin/javac" "$RUNNER_TEMP/guest/e2e"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-libs
          path: |
            ${{ runner.temp }}/guest/*.so
            ${{ runner.temp }}/guest/link/*.so
            ${{ runner.temp }}/guest/e2e/libwinapk_jni_guest.so
            ${{ runner.temp }}/guest/e2e/classes/**

  windows:
    name: Loader on Windows x64
    needs: guest
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
      - uses: actions/download-artifact@v4
        with:
          name: guest-libs
          path: guest
      - name: Build (loader, thunks, JNI wrapper)
        run: |
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include"
          cmake --build build
      - name: Run the ABI thunk test
        run: ./build/winapk-thunk-test.exe
      - name: Run the JNI wrapper test
        run: ./build/winapk-jni-test.exe
      - name: Run the variadic JNI bridge test
        run: ./build/winapk-jni-variadic-test.exe
      - name: Run the PoC checks
        run: ./build/winapk-elfrun.exe guest/libwinapk_poc_guest.so guest/libwinapk_poc_guest_packed.so
      - name: Run the guest linker test
        run: ./build/winapk-linker-test.exe guest/link
      - name: Run the real-JVM end-to-end test
        run: |
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          ./build/winapk-jvm-run.exe guest/e2e/libwinapk_jni_guest.so guest/e2e/classes
      - uses: actions/upload-artifact@v4
        with:
          name: winapk-binaries
          path: |
            build/winapk-elfrun.exe
            build/winapk-jvm-run.exe
